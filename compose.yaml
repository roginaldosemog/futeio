name: futeio

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-futeio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copie .env.example para .env}
      POSTGRES_DB: ${POSTGRES_DB:-futeio}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  postgres-test:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-futeio_test}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Copie .env.example para .env}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-futeio_test}
    ports:
      - '127.0.0.1:${TEST_POSTGRES_PORT:-5433}:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  postgres_data:
