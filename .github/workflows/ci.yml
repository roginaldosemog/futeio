name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Lint, types, tests and production builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://futeio_test:futeio_test_password@127.0.0.1:5433/futeio?schema=public
      TEST_DATABASE_URL: postgresql://futeio_test:futeio_test_password@127.0.0.1:5433/futeio_test?schema=public
      API_PORT: '3001'
      API_HOST: 127.0.0.1
      API_ORIGIN: http://127.0.0.1:3001
      PGPASSWORD: futeio_test_password
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: futeio_test
          POSTGRES_PASSWORD: futeio_test_password
          POSTGRES_DB: futeio_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U futeio_test -d futeio_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure isolated authentication fixtures
        run: node scripts/ci-auth-env.mjs
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Prepare isolated application and test databases
        run: |
          psql -h 127.0.0.1 -p 5433 -U futeio_test -d futeio_test -c 'CREATE DATABASE futeio;'
          pnpm db:migrate
          pnpm db:test:migrate
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests against PostgreSQL
        run: pnpm test:integration
      - name: Production builds
        run: pnpm build
      - name: Verify generated API contracts
        run: pnpm contracts:check
      - name: Production web and API smoke test
        run: pnpm test:smoke
      - name: Install stable Google Chrome and browser dependencies
        run: pnpm --filter @futeio/web exec playwright install --with-deps --no-remove chrome
      - name: Browser authentication journeys
        run: pnpm test:e2e
