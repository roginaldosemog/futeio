# Preparation only: create/configure an App Hosting backend later, app root = web.
# Replace these placeholder values in the Firebase console before the first rollout.
runConfig:
  minInstances: 0
  maxInstances: 1
  concurrency: 20
  cpu: 1
  memoryMiB: 512
env:
  - variable: FUTEIO_FIREBASE_MODE
    value: production
    availability: [RUNTIME]
  - variable: FIREBASE_PROJECT_ID
    value: REPLACE_WITH_PROJECT_ID
    availability: [RUNTIME]
  - variable: FIREBASE_STORAGE_BUCKET
    value: REPLACE_WITH_BUCKET_NAME
    availability: [RUNTIME]
  - variable: APP_ORIGIN
    value: https://replace-with-your-host.example
    availability: [RUNTIME]
  - variable: FIREBASE_ADMIN_UID
    secret: futeio-admin-uid
    availability: [RUNTIME]
  - variable: ADMIN_EMAIL
    secret: futeio-admin-email
    availability: [RUNTIME]
  - variable: FIREBASE_WEB_API_KEY
    secret: futeio-auth-api-key
    availability: [RUNTIME]
  - variable: AUTH_SECRET
    secret: futeio-auth-secret
    availability: [RUNTIME]
