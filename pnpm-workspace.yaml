packages:
  - web

saveExact: true
engineStrict: true
autoInstallPeers: false
allowBuilds:
  '@firebase/util': false
  protobufjs: true
  re2: true
  '@scarf/scarf': false
  '@parcel/watcher': true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@next/env@16.4.5'
  - '@next/eslint-plugin-next@16.4.5'
  - '@next/swc-darwin-arm64@16.4.5'
  - '@next/swc-darwin-x64@16.4.5'
  - '@next/swc-linux-arm64-gnu@16.4.5'
  - '@next/swc-linux-arm64-musl@16.4.5'
  - '@next/swc-linux-x64-gnu@16.4.5'
  - '@next/swc-linux-x64-musl@16.4.5'
  - '@next/swc-win32-arm64-msvc@16.4.5'
  - '@next/swc-win32-x64-msvc@16.4.5'
  - next@16.4.5
  - '@tanstack/query-core@5.105.3'
  - '@tanstack/react-query@5.105.3'

# Firebase Web SDK pins an older Node-only Firestore transport. Same-major security fix.
overrides:
  "@firebase/firestore>@grpc/grpc-js": 1.14.6
  # CLI-config is pulled by Blob authentication; patch its pinned Zod 4 transport.
  "@vercel/cli-config>zod": 4.6.7

patchedDependencies:
  jwks-rsa@4.1.0: patches/jwks-rsa@4.1.0.patch
